 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Lista de Películas — Ejercicio 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 8px 0;
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 4px solid #6c63ff;
      font-size: 1rem;
    }

    p {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>🎬 Mi Lista de Películas</h1>
  <p id="contador">Tienes 0 películas en tu lista.</p>
  <ul id="lista-peliculas"></ul>

  <script>
    /* EJERCICIO 1 — Arrays y manipulación básica del DOM. Tienes un array con los títulos de tus películas favoritas. 
     Tu objetivo es mostrarlas en pantalla dentro de la lista (<ul>). y actualizar el texto del párrafo con la cantidad total.*/
    //Crea un array llamado "peliculas".
    let peliculas = ["Pretty Woman", "Erin Brockovich", "Antes de ti", "Indiana Jones"];

    //declarar la variable define el nodo ul.
    const lista = document.getElementById("lista-peliculas");

    //recorrer el array. 
    for (let i=0 ; i < peliculas.length ; i++) {
      //crea un elemento <li>.
      const li = document.createElement ("li");
      //escribe el texto del li en cada elemento del array
      li.textContent = peliculas [i];
      //añade a la lista
      lista.appendChild(li);
    }
    
    //declarar la variable que define el nodo parrafo
    const parrafo = document.getElementById ("contador"); 
    //actualiza contador
    parrafo.textContent = "El número de películas en tu lísta es: ", peliculas.length
    







  </script>

</body>
</html>
