<!--Crea una función que:
    1. Reciba un array de numeros.
    2. Devuelva solo los numeros pares.-->
<script>
    //declarar un array e inicializar.
    let numeros =[1,2,3,4,5,6,7,8];
    //funcion para obtener los pares
    function obtenerPares (array) {
        //variable para almacenar los pares
        let numerosP = []; 
        //recorrer la array
        for (let j=0 ; j<array.length; j++){
            //si valor de cada elemento: resto modulo
            if (array[j] % 2 === 0){
                //añadir cada elemento de la array a la nueva array
                numerosP.push(array[j]);
            }
        }
        return numerosP;
    }
    //llamar a la funcion
    let resultado = obtenerPares(numeros);

    //imprir resultado en consola
    console.log(resultado);


</script>
