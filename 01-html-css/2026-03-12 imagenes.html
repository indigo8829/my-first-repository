<html lang="en">
<head>

    <title>Imagenes en html</title>
    <style>
        div {
            display: inline-block;
            width: 200px;

        }

        div .gato {

    <div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEIdFmfhu0ao9lJ4oHVL96Wz2xu71rB92BFA&s" alt=""class="gato2">
