<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio horario de tabla</title>
    <style>
        table{
            border-collapse: collapse;
            width: 40%;
            height: 80px;
            font-family:'Segoe UI'; 
            font-size: 12px;
            text-align: center;
            }

        table,th,td {
            border: 2px, dotted, black;
     
        }

        th,td {
            padding: 8px;
           
        }
        
        .izquierda {
           text-align:left; 
           background-color: blueviolet;
        }    
        </style>
</head>
<body>
    <table>
        <tr>
            <th class="izquierda">Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>
        <tr>
            <td class="izquierda">08:00</td>
            <td colspan="5">Desayuno</td>
        </tr>
        <tr>
            <td rowspan="2" class="izquierda">10:00</td>
            <td rowspan="2" class="izquierda">Yoga</td>
            <td></td>
            <td></td>
            <td></td>
            <td class="izquierda">Compras</td>
        </tr>
        <tr>
            <td colspan="3">Paseo por el parque</td>
            <td></td>
        </tr>
        <tr>
            <td class="izquierda">12:00</td>
            <td rowspan="2">Comida con amigos</td>
            <td class="izquierda">Trabajo</td>
            <td class="izquierda">Trabajo</td>
            <td class="izquierda">Amigos</td>
            <td></td>
        </tr>
        <tr>
            <td class="izquierda">14:00</td>
            <td colspan="4">Comida en casa</td>
        </tr>

    </table>

    
</body>
</html>
