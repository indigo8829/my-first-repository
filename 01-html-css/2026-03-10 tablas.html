<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordando las tablas</title>
    <style>
        table, th, td {
            border-collapse: collapse;
            border: 2px solid black; 
        }
        th {
            background-color: aqua; 
        }
        .color{
            background-color: blueviolet;
            color:white;
        }

        /*
        td, th {
            border: 1px solid black;

        }*/
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
        </tr>
        <tr>
            <td class="color">Kira</td>
            <td>Forzosa</td>
        </tr>
        <tr>
            <td>Estefanía</td>
            <td>Molina</td>
        </tr>
    </table>
</body>
</html>
